name: GDScript lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - ".gdlintrc"
      - "requirements-dev.txt"
      - ".github/workflows/gdscript-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.gd"
      - ".gdlintrc"
      - "requirements-dev.txt"
      - ".github/workflows/gdscript-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install gdtoolkit
        run: python -m pip install -r requirements-dev.txt
      - name: Lint GDScript
        run: gdlint scripts tests
