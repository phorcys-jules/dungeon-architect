name: v0.5 Release CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    env:
      GODOT_RELEASE: 4.7.1-stable
      GODOT_TEMPLATE_DIR: 4.7.1.stable
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y unzip zip
      - name: Download Godot
        run: |
          curl --fail --location --retry 3 --output godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip godot.zip -d godot-bin
          mv "godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
      - name: Download export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          curl --fail --location --retry 3 --output templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz -d templates
          cp -R templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"
      - run: timeout 60s ./godot --headless --path . --import
      - run: timeout 45s ./godot --headless --path . --script tests/v05_release_readiness_test.gd
      - name: Export Windows
        run: mkdir -p build && ./godot --headless --path . --export-release "Windows Desktop" build/dungeon-architect-windows.exe
      - name: Export Linux
        run: ./godot --headless --path . --export-release "Linux" build/dungeon-architect-linux.x86_64
      - name: Package artifacts
        run: |
          chmod +x build/dungeon-architect-linux.x86_64
          cd build
          zip dungeon-architect-v0.5.0-alpha-windows.zip dungeon-architect-windows.exe dungeon-architect-windows.pck
          tar -czf dungeon-architect-v0.5.0-alpha-linux.tar.gz dungeon-architect-linux.x86_64 dungeon-architect-linux.pck
      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-architect-v0.5.0-alpha
          path: |
            build/dungeon-architect-v0.5.0-alpha-windows.zip
            build/dungeon-architect-v0.5.0-alpha-linux.tar.gz
