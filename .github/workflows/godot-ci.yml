name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests and Windows build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GODOT_VERSION: 4.7.1
      GODOT_RELEASE: 4.7.1-stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          python -m pip install --requirement requirements-dev.txt

      - name: Lint GDScript
        run: gdlint scripts tests

      - name: Download Godot
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          mv "godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Import and validate project
        run: timeout 90s ./godot --headless --path . --import

      - name: Run all tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "::group::$test_file"
            timeout 45s ./godot --headless --path . --script "$test_file"
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -name '*_test.gd' -print | sort)

      - name: Install export templates
        run: |
          curl --fail --location --retry 3 \
            --output templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp -R templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          timeout 120s ./godot --headless --path . --export-release "Windows Desktop" build/windows/dungeon-architect.exe
          test -s build/windows/dungeon-architect.exe
          test -s build/windows/dungeon-architect.pck
          cd build/windows
          zip -9 ../dungeon-architect-windows.zip dungeon-architect.exe dungeon-architect.pck

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-architect-windows
          path: build/dungeon-architect-windows.zip
          if-no-files-found: error
          retention-days: 14
