name: Run Challenges CI

on:
  pull_request:
    paths:
      - 'scripts/roguelite/run_challenge_*.gd'
      - 'tests/run_challenges_test.gd'
      - '.github/workflows/run-challenges.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: timeout 60s ./godot --headless --path . --import
      - name: Test run challenges
        run: timeout 45s ./godot --headless --path . --script tests/run_challenges_test.gd
