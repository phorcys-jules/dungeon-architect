name: v0.4 Release CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y unzip zip
      - name: Download Godot
        run: |
          curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip godot.zip -d godot-bin
          mv godot-bin/Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: timeout 60s ./godot --headless --path . --import
      - name: Test v0.4 content
        run: timeout 45s ./godot --headless --path . --script tests/v04_release_content_test.gd
      - name: Run smoke test
        run: timeout 45s ./godot --headless --path . --script tests/smoke_test.gd
      - name: Install export templates
        run: |
          curl --fail --location --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip templates.tpz -d templates-unpacked
          cp -R templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
      - name: Export Windows
        run: |
          mkdir -p build/windows
          timeout 120s ./godot --headless --path . --export-release "Windows Desktop" build/windows/dungeon-architect.exe
          test -s build/windows/dungeon-architect.exe
          test -s build/windows/dungeon-architect.pck
          cd build/windows && zip -9 ../dungeon-architect-v0.4.0-alpha-windows.zip dungeon-architect.exe dungeon-architect.pck
      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-architect-v0.4.0-alpha-windows
          path: build/dungeon-architect-v0.4.0-alpha-windows.zip
          if-no-files-found: error
