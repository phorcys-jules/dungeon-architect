name: v0.6 Release Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Test v0.6 release metadata and migration
        run: ./godot --headless --path . --script tests/v06_release_readiness_test.gd
      - name: Test full v0.6 run integration
        run: ./godot --headless --path . --script tests/v06_full_run_integration_test.gd
      - name: Test v0.6 content wiring
        run: timeout 45s ./godot --headless --path . --script tests/v06_content_wiring_test.gd
      - name: Test adventurer combat AI
        run: timeout 45s ./godot --headless --path . --script tests/adventurer_combat_ai_test.gd
      - name: Test forge trap unlocks
        run: timeout 45s ./godot --headless --path . --script tests/trap_unlock_catalog_test.gd
      - name: Test monster progression, families and traits
        run: timeout 45s ./godot --headless --path . --script tests/monster_progression_family_test.gd
      - name: Test v0.6 balance guardrails
        run: timeout 45s ./godot --headless --path . --script tests/v06_balance_guardrails_test.gd
      - name: Test between-wave run choices
        run: timeout 45s ./godot --headless --path . --script tests/run_choice_integration_test.gd
      - name: Test selected monster team runtime
        run: timeout 45s ./godot --headless --path . --script tests/monster_team_runtime_test.gd
      - name: Test selectable labyrinth modules
        run: timeout 45s ./godot --headless --path . --script tests/labyrinth_module_loadout_test.gd
      - name: Test adventurer intelligence reports
        run: timeout 45s ./godot --headless --path . --script tests/adventurer_intelligence_test.gd
      - name: Test persistent room deck selection
        run: timeout 45s ./godot --headless --path . --script tests/room_deck_selection_integration_test.gd
      - name: Test encyclopedia persistence and coverage
        run: timeout 45s ./godot --headless --path . --script tests/encyclopedia_test.gd
      - name: Test village archives and navigation
        run: timeout 45s ./godot --headless --path . --script tests/village_navigation_test.gd
      - name: Test compact interface layout
        run: timeout 45s ./godot --headless --path . --script tests/interface_layout_test.gd
